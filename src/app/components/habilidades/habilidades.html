<section id="habilidades">
  <div class="container my-5">
    <!-- <h2 class="section-title">Skills</h2> -->
    <div class="section-header">
      <span class="section-kicker"> Learning Path</span>
      <h2 class="section-heading">
        About Me<span class="section-heading-accent"> & Skills</span>
      </h2>
      <div class="section-underline" aria-hidden="true"></div>
    </div>

    <!-- <p class="mt-5 fs-5 text-center">
      Aqui, você poderá conhecer as principais tecnologias que utilizo no desenvolvimento de
      aplicações.
    </p> -->

    <ul class="list-unstyled row row-cols-1 row-cols-lg-2 gx-5 gy-4 mt-5">
      @for (habilidade of habilidades; track habilidade.titulo) {
      <li class="col">
        <article class="habilidade-card d-flex align-items-center gap-4 h-100">
          <img width="64" height="64" [src]="habilidade.imagem" [alt]="habilidade.titulo" />

          <div>
            <h3 class="fs-4 fw-semibold fst-italic text-primary-emphasis">
              {{ habilidade.titulo }}
            </h3>
            <p class="fs-6 mb-0">{{ habilidade.descricao }}</p>
          </div>
        </article>
      </li>
      }
    </ul>
  </div>
</section>
